<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
 >
<meta name="theme-color" content="#05070a">
<meta name="description" content="Body Tracker — Seguimiento corporal en tiempo real con MediaPipe">
<title>Body Tracker</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">

<div id="platformBadge">AUTO</div>

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas"></canvas>

<div id="flash"></div>

<img id="miniaturaCaptura" alt="Captura">

<div id="topBar">
<h1>BODY TRACKER</h1>
<p id="status">Cámara detenida</p>
<p class="instruccion">
 🤏 Forma un cuadro con índice y pulgar de ambas manos → captura automática. O usa el botón 📸.
</p>
<p id="gestureIndicator" class="gesto-detectado"></p>
</div>

<div id="controlsPanel" class="controls-panel">
<select id="filterSelect" title="Filtros">
<option value="none">🎨 Sin filtro</option>
<option value="grayscale">⚫ Escala de grises</option>
<option value="sepia">🟤 Sepia</option>
<option value="invert">🟡 Negativo</option>
<option value="blur">🌫️ Desenfoque</option>
<option value="night">🌙 Modo noche</option>
<option value="mirror">🪞 Espejo</option>
</select>
</div>

<div class="buttons">
<button id="startButton">📷 Iniciar cámara</button>
<button id="switchButton">🔄 Cambiar cámara</button>
<button id="captureButton">📸 Capturar</button>
<button id="recordButton">🔴 Grabar</button>
<button id="fullscreenButton">⛶ Pantalla completa</button>
</div>

</div>

<!-- MediaPipe Pose -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

<!-- MediaPipe Face Mesh -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>

<script src="app.js"></script>

</body>
</html>
