<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta name="theme-color" content="#05070a">
  <meta
    name="description"
    content="Body Tracker: seguimiento independiente de manos, cara y cuerpo con MediaPipe."
  >
  <title>Body Tracker</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="container">
    <div id="platformBadge">AUTO</div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="flash" aria-hidden="true"></div>

    <img
      id="miniaturaCaptura"
      alt="Última captura"
      title="Toca para abrir la última captura"
    >

    <header id="topBar">
      <h1>BODY TRACKER</h1>

      <p id="status" role="status" aria-live="polite">
        Cámara detenida
      </p>

      <p class="instruccion">
        🤏 Forma un marco con el índice y el pulgar de ambas manos
        para una captura automática.
      </p>

      <p
        id="gestureIndicator"
        class="gesto-detectado"
        aria-live="polite"
      ></p>
    </header>

    <div id="controlsPanel" class="controls-panel">
      <label class="sr-only" for="filterSelect">
        Filtro de cámara
      </label>

      <select id="filterSelect" title="Filtros de cámara">
        <option value="none">🎨 Sin filtro</option>
        <option value="grayscale">⚫ Escala de grises</option>
        <option value="sepia">🟤 Sepia</option>
        <option value="invert">🟡 Negativo</option>
        <option value="blur">🌫️ Desenfoque</option>
        <option value="night">🌙 Modo noche</option>
        <option value="thermal">🌡️ Térmico simulado</option>
        <option value="mirror">🪞 Voltear imagen</option>
      </select>
    </div>

    <nav class="buttons" aria-label="Controles de cámara">
      <button id="startButton" type="button">
        📷 Iniciar cámara
      </button>

      <button id="switchButton" type="button" disabled>
        🔄 Cambiar cámara
      </button>

      <button id="fullscreenButton" type="button">
        ⛶ Pantalla completa
      </button>
    </nav>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"
    crossorigin="anonymous"
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"
    crossorigin="anonymous"
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"
    crossorigin="anonymous"
  ></script>

  <script src="app.js"></script>
</body>
</html>
