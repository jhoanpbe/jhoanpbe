<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mi Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="container">

        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>

        <div id="flash"></div>

        <img id="miniaturaCaptura" alt="Última captura">
        <a id="descargaCaptura" style="display:none;"></a>

        <div id="topBar">
            <h1>Seguimiento humano</h1>
            <p id="status">Cámara detenida</p>
        </div>

        <div class="buttons">
            <button id="startButton">📷 Iniciar cámara</button>
            <button id="switchButton">🔄 Cambiar cámara</button>
        </div>

    </div>

    <!-- Detector del cuerpo (versión fija, estable) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>

    <!-- Detector de manos (versión fija, estable) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>

    <!-- Nuestro programa -->
    <script src="app.js"></script>

</body>

</html>
